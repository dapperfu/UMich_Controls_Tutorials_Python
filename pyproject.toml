[tool.ruff]
# Enable pyproject.toml support
target-version = "py37"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv*",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable pycodestyle (E), pyflakes (F), and isort (I) rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["control", "numpy", "scipy", "matplotlib", "seaborn"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Automatically detect the appropriate line ending
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
# Allow longer lines in notebooks (they're often auto-generated)
# Allow uppercase variables in notebooks (common in control systems: K, Kp, Ki, Kd, C, etc.)
"*.ipynb" = ["E501", "N803", "N806"]

